x-defaults: &defaults
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"        # Docker rotates; podman (k8s-file) ignores max-file and truncates at max-size

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  redpanda-edge:
    image: redpandadata/redpanda:latest
    container_name: redpanda-broker-edge
    restart: unless-stopped
    <<: *defaults
    deploy:
      resources:
        limits:
          memory: 1536m
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
    ports:
      - 127.0.0.1:18081:18081
      - 127.0.0.1:18082:18082
      - 127.0.0.1:19092:19092
      - 127.0.0.1:19644:9644
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda-edge:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      # Address the broker advertises to clients that connect to the HTTP Proxy.
      - --advertise-pandaproxy-addr internal://redpanda-edge:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      # Redpanda brokers use the RPC API to communicate with each other internally.
      - --rpc-addr redpanda-edge:33145
      - --advertise-rpc-addr redpanda-edge:33145
      - --smp 1
      - --memory 1G
      - --mode dev-container
      - --default-log-level=info
    volumes:
      - ${STACK_DATA_DIR}/redpanda-broker-edge:/var/lib/redpanda/data
    networks:
      - kafka-edge

  console-edge:
    image: redpandadata/console:latest
    container_name: redpanda-console-edge
    restart: unless-stopped
    <<: *defaults
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/admin/health"]
    ports:
      - 8080:8080
    depends_on:
      redpanda-edge:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c '/app/console'
    volumes:
      - ./redpanda-console.yml:/tmp/config.yml:ro
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
    networks:
      - kafka-edge

  # one-shot: create topics with fixed partitions + retention; alter-config also applies to existing topics
  topic-init:
    image: redpandadata/redpanda:latest
    container_name: redpanda-topic-init-edge
    restart: "no"
    <<: *defaults
    healthcheck:
      disable: true
    depends_on:
      redpanda-edge:
        condition: service_healthy
    networks:
      - kafka-edge
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        for t in factory1:604800000; do    # topic:retention.ms
          rpk topic describe $${t%%:*} -X brokers=redpanda-edge:9092 >/dev/null 2>&1 \
            || rpk topic create $${t%%:*} -p 1 -c retention.ms=$${t##*:} -X brokers=redpanda-edge:9092
          rpk topic alter-config $${t%%:*} --set retention.ms=$${t##*:} -X brokers=redpanda-edge:9092
        done

networks:
  kafka-edge:
    external: true
