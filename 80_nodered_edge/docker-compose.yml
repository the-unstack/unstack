x-defaults: &defaults
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"        # Docker rotates; podman (k8s-file) ignores max-file and truncates at max-size

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  nodered-edge:
    container_name: nodered-edge
    image: nodered/node-red:latest
    restart: unless-stopped
    <<: *defaults
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:1880/"]
    ports:
      - 1880:1880
    volumes:
      - ${STACK_DATA_DIR}/nodered-edge:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: "Europe/Berlin"
      NODE_RED_ENABLE_PROJECTS: true
    networks:
      - mqtt

networks:
  mqtt:
    external: true
