input:
  redpanda:
    seed_brokers: [ "${KAFKA_BROKER}" ]
    topics: [ factory1 ]
    consumer_group: factory1-to-global

output:
  redpanda:
    seed_brokers: [ "${KAFKA_BROKER}" ]
    topic: global
    key: ${! metadata("kafka_key") }
    metadata: { include_prefixes: [ uns_ ] }   # required: default forwards no headers
    batching: { count: 200, period: 100ms }
