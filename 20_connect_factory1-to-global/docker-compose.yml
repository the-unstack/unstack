x-defaults: &defaults
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"        # Docker rotates; podman (k8s-file) ignores max-file and truncates at max-size

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  connect-factory1-to-global:
    image: redpandadata/connect:latest
    container_name: connect-factory1-to-global
    restart: unless-stopped
    <<: *defaults
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4195/ready"]
    command: -c /config/pipeline.yml
    environment:
      KAFKA_BROKER: "redpanda-global:9092"
    volumes:
      - ./pipeline.yml:/config/pipeline.yml:ro
    networks:
      - kafka-global

networks:
  kafka-global:
    external: true
