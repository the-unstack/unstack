x-defaults: &defaults
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"        # Docker rotates; podman (k8s-file) ignores max-file and truncates at max-size

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  opcua:
    container_name: opcplc-opcua-simulator
    image: mcr.microsoft.com/iotedge/opc-plc:latest
    restart: unless-stopped
    <<: *defaults
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pgrep opcplc"]
    ports:
      - 4840:4840
    command:
      - --pn=4840
      - --autoaccept    # all certs are trusted
      - --sn=5          # slow nodes - number
      - --sr=10         # slow nodes - rate in seconds
      - --st=Double     # slow nodes - data type
      - --str=true      # slow nodes - randomization
      - --stl=-20.0     # slow nodes - lower bound
      - --stu=99.0      # slow nodes - upper bound
      - --sts=0.01      # slow nodes - step size
      - --gn=0
