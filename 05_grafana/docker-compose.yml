x-defaults: &defaults
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"        # Docker rotates; podman (k8s-file) ignores max-file and truncates at max-size

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    <<: *defaults
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health"]
    ports:             # disable ports section, when running with reverse proxy
      - 3000:3000      #
    environment:
      GF_SERVER_ROOT_URL: ""   # only needed with reverse proxy
      GF_SECURITY_ADMIN_USER: ${GRAFANA_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_SECURITY_ADMIN_PASSWORD}
      # datasource provisioning (config/datasources.yml)
      GRAFANA_DB_USER: ${GRAFANA_DB_USER}
      GRAFANA_DB_PASS: ${GRAFANA_DB_PASS}
      POSTGRES_DB: ${POSTGRES_DB}
    user: '1000'
    volumes:
      - ./grafana.ini:/etc/grafana/grafana.ini
      - ./config/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./config/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./dashboards:/var/lib/grafana/dashboards
      - ${STACK_DATA_DIR}/grafana:/var/lib/grafana
    networks:
      - postgres

networks:
  postgres:
    external: true
