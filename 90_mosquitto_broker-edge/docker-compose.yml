x-defaults: &defaults
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"        # Docker rotates; podman (k8s-file) ignores max-file and truncates at max-size

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto-broker
    restart: always
    <<: *defaults
    deploy:
      resources:
        limits:
          memory: 128m
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "mosquitto_sub -p 1882 -t '$$SYS/#' -C 1 -i healthcheck -W 3"]
    ports:
      - 1883:1883
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ${STACK_DATA_DIR}/mosquitto/data:/mosquitto/data
    networks:
      - mqtt

networks:
  mqtt:
    external: true
