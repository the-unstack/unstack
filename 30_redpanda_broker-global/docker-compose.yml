x-defaults: &defaults
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"        # Docker rotates; podman (k8s-file) ignores max-file and truncates at max-size

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  redpanda-global:
    image: redpandadata/redpanda:latest
    container_name: redpanda-broker-global
    restart: unless-stopped
    <<: *defaults
    deploy:
      resources:
        limits:
          memory: 1536m
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
    ports:
      - 127.0.0.1:28081:28081
      - 127.0.0.1:28082:28082
      - 29092:29092             # 10.10.0.1:29092:29092 when using wireguard to communicate with the edge devices
      - 127.0.0.1:29644:9644                          # the kafka-addr needs to be accessible by the edge-devices
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr internal://redpanda-global:9092,external://host.docker.internal:29092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:28082
      # Address the broker advertises to clients that connect to the HTTP Proxy.
      - --advertise-pandaproxy-addr internal://redpanda-global:8082,external://localhost:28082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:28081
      # Redpanda brokers use the RPC API to communicate with each other internally.
      - --rpc-addr redpanda-global:33145
      - --advertise-rpc-addr redpanda-global:33145
      - --smp 1
      - --memory 1G
      - --mode dev-container
      - --default-log-level=info
    volumes:
      - ${STACK_DATA_DIR}/redpanda-broker-global:/var/lib/redpanda/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kafka-global

  console-global:
    image: redpandadata/console:latest
    container_name: redpanda-console-global
    restart: unless-stopped
    <<: *defaults
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/admin/health"]
    ports:
      - 8090:8080
    depends_on:
      redpanda-global:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c '/app/console'
    volumes:
      - ./redpanda-console.yml:/tmp/config.yml:ro
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
    networks:
      - kafka-global

  # one-shot: create topics with fixed partitions + retention; alter-config also applies to existing topics
  topic-init:
    image: redpandadata/redpanda:latest
    container_name: redpanda-topic-init-global
    restart: "no"
    <<: *defaults
    healthcheck:
      disable: true
    depends_on:
      redpanda-global:
        condition: service_healthy
    networks:
      - kafka-global
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        for t in factory1:604800000 global:604800000 dlq:2592000000; do    # topic:retention.ms
          rpk topic describe $${t%%:*} -X brokers=redpanda-global:9092 >/dev/null 2>&1 \
            || rpk topic create $${t%%:*} -p 1 -c retention.ms=$${t##*:} -X brokers=redpanda-global:9092
          rpk topic alter-config $${t%%:*} --set retention.ms=$${t##*:} -X brokers=redpanda-global:9092
        done

networks:
  kafka-global:
    external: true
