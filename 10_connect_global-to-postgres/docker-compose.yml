x-defaults: &defaults
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"        # Docker rotates; podman (k8s-file) ignores max-file and truncates at max-size

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  connect:
    image: redpandadata/connect:latest
    container_name: connect-global-to-postgres
    restart: always
    <<: *defaults
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4195/ready"]
    expose:
      - "4195"
    command: -c /config/pipeline.yml
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB}
      KAFKA_BROKER: redpanda-global:9092
    volumes:
      - ./pipeline.yml:/config/pipeline.yml
    depends_on:
      redis:
        condition: service_healthy
        restart: true
    networks:
      - postgres
      - kafka-global
      - global-to-postgres

  redis:
    image: redis:latest
    container_name: connect-global-to-postgres-redis
    restart: always
    <<: *defaults
    deploy:
      resources:
        limits:
          memory: 128m
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
    expose:
      - "6379"
    command: --loglevel warning # debug, verbose, notice, warning, nothing
    environment:
      - REDIS_PORT=6379
    networks:
      - global-to-postgres

networks:
  global-to-postgres:
    driver: bridge
  kafka-global:
    external: true
  postgres:
    external: true
