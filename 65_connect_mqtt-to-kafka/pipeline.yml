input:
  mqtt:
    urls:
      - tcp://${MQTT_BROKER_LOCAL}
    client_id: "redpanda-connect-mqtt-to-kafka"
    connect_timeout: 30s
    qos: 1                 # broker queues while we're down (mosquitto persistence)
    clean_session: false   # ...and delivers the backlog on reconnect
    topics:
      - '#'

pipeline:
  processors:
    - bloblang: |
        root = if metadata("mqtt_topic").or("") == "" { deleted() }   # no key → no row, drop
        meta uns_timestamp_ms = timestamp_unix_milli()
        meta uns_origin = "factory1"

output:
  redpanda:
    seed_brokers: [ "${KAFKA_BROKER_LOCAL}" ]
    topic: factory1
    key: ${! metadata("mqtt_topic") }
    metadata: { include_prefixes: [ uns_ ] }   # required: default forwards no headers
    batching: { count: 200, period: 100ms }
