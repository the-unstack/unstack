x-defaults: &defaults
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"        # Docker rotates; podman (k8s-file) ignores max-file and truncates at max-size

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  connect:
    image: redpandadata/connect:latest
    container_name: connect-mqtt-to-kafka
    restart: always
    <<: *defaults
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4195/ready"]
    expose:
      - "4195"
    command: -c /config/pipeline.yml
    environment:
      MQTT_BROKER_LOCAL: "mosquitto:1883"
      KAFKA_BROKER_LOCAL: "redpanda-edge:9092"
    volumes:
      - ./pipeline.yml:/config/pipeline.yml
    networks:
      - kafka-edge
      - mqtt

networks:
  kafka-edge:
    external: true
  mqtt:
    external: true
