x-defaults: &defaults
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"        # Docker rotates; podman (k8s-file) ignores max-file and truncates at max-size

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  adminer:
    image: adminer:latest
    container_name: adminer
    restart: always
    <<: *defaults
    deploy:
      resources:
        limits:
          memory: 128m
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/"]
    ports:                # disable ports section when running with separate reverse proxy
      - "3010:8080"
    environment:
      - ADMINER_DESIGN=haeckel
      - ADMINER_DEFAULT_SERVER=timescaledb
    networks:
      - postgres

networks:
  postgres:
    external: true
