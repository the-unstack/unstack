x-defaults: &defaults
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"        # Docker rotates; podman (k8s-file) ignores max-file and truncates at max-size

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg18
    container_name: timescaledb
    restart: always
    <<: *defaults
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    expose:
      - 5432
    shm_size: 256mb
    environment:
      PGDATA: '/var/lib/postgresql/data/pgdata'   # subdir: mount root stays free of PG's lost+found/permission checks
      POSTGRES_DB: '${POSTGRES_DB}'
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      GRAFANA_DB_USER: '${GRAFANA_DB_USER}'
      GRAFANA_DB_PASS: '${GRAFANA_DB_PASS}'
      TS_TUNE_MEMORY: 1GB     # timescaledb-tune sizes for the container limit, not the host
      TS_TUNE_NUM_CPUS: 2
    volumes:
      - ${STACK_DATA_DIR}/timescaledb/postgres:/var/lib/postgresql/data
      # per-file mounts: a dir mount would hide the image's own 000_/001_ init scripts
      - ./db-init/101_create-tables.sql:/docker-entrypoint-initdb.d/101_create-tables.sql:ro
      - ./db-init/102_create-views.sql:/docker-entrypoint-initdb.d/102_create-views.sql:ro
      - ./db-init/103_create_grafana_user.sh:/docker-entrypoint-initdb.d/103_create_grafana_user.sh:ro
    networks:
      - postgres

networks:
  postgres:
    external: true
